<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Stay — Super Galaxy Hotel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">Super Galaxy <span>Hotel</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="rooms.html">Rooms</a>
      <a href="booking.html" class="active">Book</a>
     <a href="contact.html">Contact</a>
<a href="signin.html">Login</a>
<a href="booking.html" class="nav-cta">Reserve</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section class="page-header">
  <div class="wrap">
    <div class="kicker">Reservations</div>
    <h1>Book your stay</h1>
  </div>
</section>

<section class="section">
  <div class="wrap" style="display:grid; grid-template-columns: 1.6fr 1fr; gap:48px; align-items:start;">
    <div class="booking-panel">
      <form id="booking-form">
        <div class="form-grid">
          <div class="field full">
            <label for="room-select">Room</label>
            <select id="room-select" name="room_id" required></select>
          </div>
          <div class="field">
            <label for="check_in">Check-in</label>
            <input type="date" id="check_in" name="check_in" required>
          </div>
          <div class="field">
            <label for="check_out">Check-out</label>
            <input type="date" id="check_out" name="check_out" required>
          </div>
          <div class="field">
            <label for="guests">Guests</label>
            <select id="guests" name="guests">
              <option value="1">1 guest</option>
              <option value="2" selected>2 guests</option>
              <option value="3">3 guests</option>
              <option value="4">4 guests</option>
            </select>
          </div>
          <div class="field">
            <label for="guest_phone">Phone</label>
            <input type="tel" id="guest_phone" name="guest_phone" placeholder="Optional">
          </div>
          <div class="field">
            <label for="guest_name">Full name</label>
            <input type="text" id="guest_name" name="guest_name" required>
          </div>
          <div class="field">
            <label for="guest_email">Email</label>
            <input type="email" id="guest_email" name="guest_email" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Confirm booking</button>
        <div id="form-msg" class="form-msg"></div>
      </form>
    </div>

    <aside class="booking-summary">
      <h3>Your stay</h3>
      <div class="summary-row"><span>Room</span><span id="summary-room">—</span></div>
      <div class="summary-row"><span>Nights</span><span id="summary-nights">—</span></div>
      <div class="summary-row"><span>Nightly rate</span><span id="summary-rate">—</span></div>
      <div class="summary-row total"><span>Total</span><span id="summary-total">—</span></div>
    </aside>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Super Galaxy Hotel. All rights reserved.</span>
      <span>Narhe, Pune, since 1932</span>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/rooms.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
